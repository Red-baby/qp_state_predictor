seed: 42

data:
  labels_csv: "/path/to/frame_labels.csv"
  yuv_root: "/path/to/yuv_folder"
  cache_dir: "/path/to/cache"
  output_root: "/path/to/outputs"

  sequence_col: "sequence"
  poc_col: "poc"
  qp_col: "enc_qp"
  bits_col: "enc_bits"
  psnr_col: "enc_psnr"
  mse_col: "enc_mse"

  group_cols: ["sequence"]
  split_by_col: "sequence"

  yuv_sequence_col: "sequence"
  yuv_filename_template: "{sequence}.yuv"

  width: 1280
  height: 720
  bit_depth: 8

  resize_width: 192
  resize_height: 108

  i_interval: 125
  gop_size: 16
  infer_refs_if_missing: true

  explicit_ref_columns:
    frame_type: null
    temporal_layer: null
    ref_poc_1: null
    ref_poc_2: null

  train_ratio: 0.8
  val_ratio: 0.1
  test_ratio: 0.1

  # 当前帧/参考帧 QP 与 pass1_qp 的 min-max 归一化：(x - min) / (max - min)，默认约 30～255
  qp_norm_min: 30
  qp_norm_max: 255

  # pass1 先验特征（来自 CSV，不来自 YUV）
  use_pass1_features: false
  pass1_columns:
    qp: "pass1_qp"
    bits: "pass1_bits"
    mse: "pass1_mse"
    psnr: "pass1_psnr"

  # 训练输出目录 = output_root / (phase{N} + 后缀)；single 时另追加 _logmse/_psnr；double 时追加 _double_bits/_double_psnr/_double_mse（见 model.mode）
  output_phase_no_pass1_suffix: ""
  output_phase_pass1_suffix: "_pass1"

features:
  block_size: 8
  entropy_bins: 32
  edge_threshold: 0.08
  changed_threshold: 0.03
  pair_block_size: 8
  # Phase 2/3：先运行 python -m qp_predictor.preprocess_pair_cache --config ... 生成 <seq>.pair.npz 后再设 true
  use_pair_cache: false
  pair_cache_suffix: ".pair.npz"
  pair_cache_required: false
  pair_cache_fallback_online: true

train:
  num_workers: 4
  epochs: 40
  batch_size_phase1: 256
  batch_size_phase2: 256
  batch_size_phase3: 8
  lr: 1.0e-3
  weight_decay: 1.0e-5
  huber_delta: 0.2
  grad_clip: 5.0
  amp: true
  device: "cuda"
  save_every: 1

loss:
  bits_weight: 1.0
  mse_weight: 1.0
  aux_weight: 0.3
  # 失真第二项：log_mse（默认）| psnr（dB 空间 Huber；delta 自动 = train.huber_delta * huber_delta_psnr_scale，默认×5）
  # 可选：huber_delta_psnr 指定绝对 dB 阈值；不设则用 scale
  mse_term: "log_mse"
  huber_delta_psnr: null
  huber_delta_psnr_scale: 5.0

# 训练：python -m qp_predictor.train --config ... --phase 1 --model-mode single --mse-term psnr
# 或环境变量 QP_TRAIN_MODEL_MODE / QP_TRAIN_DOUBLE_TARGET / QP_TRAIN_MSE_TERM
model:
  mode: "single"
  double_target: "bits"
  self_hidden: 128
  edge_hidden: 128
  state_hidden: 64
  head_hidden: 128
  dropout: 0.1
  state_dim: 32

eval:
  max_psnr_value: 255.0
