seed: 42

data:
  labels_csv: "/path/to/frame_labels.csv"
  yuv_root: "/path/to/yuv_folder"
  cache_dir: "/path/to/cache"
  output_root: "/path/to/outputs"

  sequence_col: "sequence"
  poc_col: "poc"
  qp_col: "enc_qp"
  bits_col: "enc_bits"
  psnr_col: "enc_psnr"
  mse_col: "enc_mse"

  group_cols: ["sequence"]
  split_by_col: "sequence"

  yuv_sequence_col: "sequence"
  yuv_filename_template: "{sequence}.yuv"

  width: 1280
  height: 720
  bit_depth: 8

  resize_width: 192
  resize_height: 108

  i_interval: 125
  gop_size: 16
  tail_hier_min: 4
  infer_refs_if_missing: false

  explicit_ref_columns:
    frame_type: null
    temporal_layer: "level"
    ref_poc_1: "refpoc0"
    ref_poc_2: "refpoc1"
    ref_qp_1: "refqp0"
    ref_qp_2: "refqp1"
  intra_period_pos_col: "intra_period_pos"

  train_ratio: 0.8
  val_ratio: 0.1
  test_ratio: 0.1

  # 当前帧/参考帧 QP 与 pass1_qp 的 min-max 归一化：(x - min) / (max - min)，默认约 30～255
  qp_norm_min: 30
  qp_norm_max: 255

  # loss.mse_term=vmaf 时必填：CSV 中作为监督标签的 VMAF 列，例如 "pass2_vmaf"
  vmaf_col: null

  # pass1 先验特征默认启用，列名默认读取：
  #   pass1_qp / pass1_bits / pass1_mse / pass1_psnr / pass1_vmaf
  pass1_vmaf_norm_div: 100.0

  # 训练输出目录固定为 phase{N}_pass1 + 失真后缀；single 时再追加 _logmse/_psnr/_vmaf，double 时追加 _double_bits/_double_psnr/_double_mse/_double_vmaf

features:
  block_size: 8
  entropy_bins: 32
  edge_threshold: 0.08
  changed_threshold: 0.03
  pair_block_size: 8
  # Phase 2/3：先运行 python -m qp_predictor.preprocess_pair_cache --config ... 生成 <seq>.pair.npz 后再设 true
  use_pair_cache: false
  pair_cache_suffix: ".pair.npz"
  pair_cache_required: false
  pair_cache_fallback_online: true

train:
  num_workers: 4
  epochs: 40
  batch_size_phase1: 256
  batch_size_phase2: 256
  # Phase3：当前实现要求 batch 内 topo_order 完全一致；通用安全配置请设为 1
  batch_size_phase3: 1
  lr: 1.0e-3
  weight_decay: 1.0e-5
  huber_delta: 0.2
  grad_clip: 5.0
  amp: true
  device: "cuda"
  save_every: 1

loss:
  bits_weight: 1.0
  mse_weight: 1.0
  aux_weight: 0.3
  bits_linear_weight: 0.25
  bits_linear_divisor: 16384.0
  bits_linear_huber_delta: null
  # 失真第二项：log_mse（默认）| psnr（dB 空间 Huber）| vmaf（直接回归 VMAF）
  # 可选：huber_delta_psnr / huber_delta_vmaf 指定绝对阈值；不设则用对应 scale
  mse_term: "log_mse"
  huber_delta_psnr: null
  huber_delta_psnr_scale: 5.0
  huber_delta_vmaf: null
  huber_delta_vmaf_scale: 2.0

# 训练：python -m qp_predictor.train --config ... --phase 1 --model-mode single --mse-term psnr
# VMAF 例子：python -m qp_predictor.train --config ... --phase 2 --model-mode double --double-target distortion --mse-term vmaf
# 或环境变量 QP_TRAIN_MODEL_MODE / QP_TRAIN_DOUBLE_TARGET / QP_TRAIN_MSE_TERM
model:
  mode: "single"
  double_target: "bits"
  phase1_variant: "flat"   # flat | phase1_1
  phase2_variant: "flat"   # flat | phase2_1 | phase2_2
  self_hidden: 128
  edge_hidden: 128
  state_hidden: 64
  head_hidden: 128
  dropout: 0.1
  state_dim: 32

eval:
  max_psnr_value: 255.0
