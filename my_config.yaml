seed: 42

data:
  # VMAF 训练请用带 pass1_vmaf/pass2_vmaf 的合并表
  labels_csv: "/data/lh/qp_state_predictor/dataset/vca_rc_merged_with_pass1_vmaf.csv"
  yuv_root: "/mnt/ec-data2/lh_data/vtcoder_yuv/720p/"
  cache_dir: "/data/lh/qp_state_predictor/qp_state_predictor_cache/"
  output_root: "/data/lh/qp_state_predictor/outputs/"

  sequence_col: "sequence"
  poc_col: "poc"
  qp_col: "enc_qp"
  bits_col: "enc_bits"
  psnr_col: "enc_psnr"
  mse_col: "enc_mse"

  group_cols: ["sequence"]
  split_by_col: "sequence"

  yuv_sequence_col: "sequence"
  yuv_filename_template: "{sequence}.yuv"

  width: 1280
  height: 720
  bit_depth: 8

  resize_width: 192
  resize_height: 108

  i_interval: 125
  gop_size: 16
  infer_refs_if_missing: true

  explicit_ref_columns:
    frame_type: null
    temporal_layer: null
    ref_poc_1: null
    ref_poc_2: null

  train_ratio: 0.8
  val_ratio: 0.1
  test_ratio: 0.1

  # 当前帧/参考帧 QP 与 pass1_qp 的 min-max 归一化：(x - min) / (max - min)，与数据范围一致
  qp_norm_min: 30
  qp_norm_max: 255

  # pass1 先验特征（来自 CSV）；启用后模型输入多 4 维 pass1 向量
  use_pass1_features: true
  pass1_columns:
    qp: "pass1_qp"
    bits: "pass1_bits"
    mse: "pass1_mse"
    psnr: "pass1_psnr"
    # loss.mse_term=vmaf 时作为网络输入第 3 维（见 pass1_vmaf_norm_div）；列名默认可不填
    vmaf: "pass1_vmaf"

  # CSV 列为 pass1_vmaf / pass2_vmaf；mse_term=vmaf 时仅 vmaf_col 指向的那一列作为监督标签
  vmaf_col: "pass2_vmaf" # 改 "pass1_vmaf" 则用第一遍编码段 VMAF 作标签

  # 输出目录名 = phase{N} + pass1 后缀 + 后缀：
  #   model.mode=single：+ _logmse | _psnr | _vmaf（由 loss.mse_term）
  #   model.mode=double：+ _double_bits | _double_psnr | _double_mse | _double_vmaf
  output_phase_no_pass1_suffix: ""
  output_phase_pass1_suffix: "_pass1"

features:
  block_size: 8
  entropy_bins: 32
  edge_threshold: 0.08
  changed_threshold: 0.03
  pair_block_size: 8
  # Phase 2/3：生成 pair sidecar 后设为 true（见 README preprocess_pair_cache）
  use_pair_cache: true
  pair_cache_suffix: ".pair.npz"
  pair_cache_required: false
  pair_cache_fallback_online: true

train:
  num_workers: 64
  # 每 epoch 是否在训练集上跑完整 eval；false 可省大量内存/时间（val/test 仍 eval）。OOM 时可设 false
  eval_full_train_each_epoch: true
  # DataLoader 预取（仅 num_workers>0 生效）；远端盘慢时可试 6～8
  prefetch_factor: 8
  epochs: 50
  # 单卡：即为该卡 batch。双卡 DDP（torchrun）：为每卡 batch，全局 batch ≈ 该值 × GPU 数
  batch_size_phase1: 512
  batch_size_phase2: 512
  # Phase3：当前实现要求 batch 内 topo_order 一致；不同 segment 拓扑不同须设为 1，否则会报错
  batch_size_phase3: 1
  lr: 1.0e-3
  weight_decay: 1.0e-5
  huber_delta: 0.2
  grad_clip: 5.0
  amp: true
  device: "cuda"
  save_every: 1
  # DDP 专用（一般保持 false；仅当某阶段报 unused parameter 再改为 true）
  ddp_find_unused_parameters: false

loss:
  bits_weight: 1.0
  mse_weight: 1.0
  aux_weight: 0.3
  # 失真第二项：log_mse | psnr | vmaf（直接回归 VMAF；需 data.vmaf_col 与 CSV 列）
  mse_term: "psnr"
  huber_delta_psnr: null
  huber_delta_psnr_scale: 5.0
  # huber_delta_vmaf: null
  # huber_delta_vmaf_scale: 2.0

# 训练脚本可用 CLI/环境变量覆盖 model.mode、model.double_target、loss.mse_term，便于循环扫参：
#   python -m qp_predictor.train --config my_config.yaml --phase 1 --model-mode single --mse-term psnr
#   python -m qp_predictor.train --config my_config.yaml --phase 2 --model-mode double --double-target bits
#   python -m qp_predictor.train --config my_config.yaml --phase 1 --model-mode double --double-target distortion --mse-term log_mse
# 环境变量（CLI 未写时）：QP_TRAIN_MODEL_MODE, QP_TRAIN_DOUBLE_TARGET, QP_TRAIN_MSE_TERM
model:
  # single：一头输出 2 维 (bits, log_mse)；double：两头各训一个同结构单输出网络，目录见 data 说明
  mode: "double"
  # mode=double 时：bits → 仅训码率；distortion → 仅训失真（psnr→_double_psnr，log_mse→_double_mse，vmaf→_double_vmaf）
  double_target: "bits"
  phase2_variant: "phase2_1"
  self_hidden: 128
  edge_hidden: 128
  state_hidden: 64
  head_hidden: 128
  dropout: 0.1
  state_dim: 32

eval:
  max_psnr_value: 255.0
