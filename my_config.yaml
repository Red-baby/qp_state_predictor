seed: 42

data:
  # VMAF 训练请用带 pass1_vmaf/pass2_vmaf 的合并表
  labels_csv: "/data/lh/qp_state_predictor/dataset/training.csv"
  yuv_root: "/mnt/ec-data2/lh_data/vtcoder_yuv/720p/"
  cache_dir: "/data/lh/qp_state_predictor/qp_state_predictor_new_cache/"
  # DataLoader 每个 worker 内最多同时 mmap 的序列数；shuffle 跨很多序列时过小会反复打开文件略慢，过大易 OOM
  cache_max_open_sequences: 10
  pair_cache_max_open_sequences: 10
  y_lowres_cache_suffix: ".ylow.npy"
  y_lowres_cache_max_open_sequences: 2
  # Phase1 预打包 tensor cache：worker 内 LRU 上限（与 Phase2 类似）
  phase1_tensor_cache_max_open_sequences: 4
  # Phase2 预打包 tensor cache 在 worker 内以整序列 ndarray 常驻；按 sequence 聚 batch 时 2～4 通常足够
  phase2_tensor_cache_max_open_sequences: 4
  output_root: "/data/lh/qp_state_predictor/outputs/"

  sequence_col: "sequence"
  poc_col: "poc"
  qp_col: "enc_qp"
  bits_col: "enc_bits"
  psnr_col: "enc_psnr"
  mse_col: "enc_mse"

  group_cols: ["sequence"]
  split_by_col: "sequence"

  yuv_sequence_col: "sequence"
  yuv_filename_template: "{sequence}.yuv"

  width: 1280
  height: 720
  bit_depth: 8

  resize_width: 192
  resize_height: 108

  i_interval: 125
  gop_size: 16
  tail_hier_min: 4
  infer_refs_if_missing: false

  explicit_ref_columns:
    frame_type: null
    temporal_layer: "level"
    ref_poc_1: "refpoc0"
    ref_poc_2: "refpoc1"
    ref_qp_1: "refqp0"
    ref_qp_2: "refqp1"
  intra_period_pos_col: "intra_period_pos"

  train_ratio: 0.8
  val_ratio: 0.1
  test_ratio: 0.1

  # 当前帧/参考帧 QP 与 pass1_qp 的 min-max 归一化：(x - min) / (max - min)，与数据范围一致
  qp_norm_min: 30
  qp_norm_max: 255

  # pass1 先验特征默认启用，列名默认读取：
  #   pass1_qp / pass1_bits / pass1_mse / pass1_psnr / pass1_vmaf

  # CSV 列为 pass1_vmaf / pass2_vmaf；mse_term=vmaf 时仅 vmaf_col 指向的那一列作为监督标签
  vmaf_col: "pass2_vmaf" # 改 "pass1_vmaf" 则用第一遍编码段 VMAF 作标签

  # 输出目录名固定为 phase{N}_pass1 + 后缀：
  #   model.mode=single：+ _logmse | _psnr | _vmaf（由 loss.mse_term）
  #   model.mode=double：+ _double_bits | _double_psnr | _double_mse | _double_vmaf

features:
  block_size: 8
  entropy_bins: 32
  edge_threshold: 0.08
  changed_threshold: 0.03
  pair_block_size: 8
  # Phase 2/3：生成 pair sidecar 后设为 true（见 README preprocess_pair_cache）
  use_pair_cache: true
  pair_cache_suffix: ".pair.npz"
  pair_cache_required: false
  pair_cache_fallback_online: false
  # 生成 <seq>.phase1_<profile>_<tag>.npz 后，Phase1 可整块读取（需先 preprocess_cache）
  use_phase1_tensor_cache: true
  phase1_tensor_cache_required: true
  # 生成 <seq>.phase2_<profile>_<mse_term>.npz 后，Phase2 可直接整块读取训练张量
  use_phase2_tensor_cache: true
  phase2_tensor_cache_required: true

train:
  # 过大会拖垮系统内存（子进程 × prefetch × batch）；OOM 时降到 2～4，或设 num_workers: 0
  num_workers: 8
  # 训练集整轮 eval 开销很大；只看 val/test 可先设 false，训练吞吐会明显更高
  eval_full_train_each_epoch: false
  # DataLoader 预取（仅 num_workers>0 生效）；与 num_workers 相乘会占用大量 RAM
  prefetch_factor: 2
  # 训练集按 sequence 聚 batch，显著减少跨序列随机读导致的 cache thrash
  sequence_grouped_batches: true
  epochs: 100
  # 单卡：即为该卡 batch。双卡 DDP（torchrun）：为每卡 batch，全局 batch ≈ 该值 × GPU 数
  batch_size_phase1: 512
  # 在 LRU cache 限制下恢复到更大的 Phase2 batch，减少每 epoch step 数
  batch_size_phase2: 512
  # Phase3：当前实现要求 batch 内 topo_order 一致；不同 segment 拓扑不同须设为 1，否则会报错
  batch_size_phase3: 1
  lr: 1.0e-3
  weight_decay: 1.0e-5
  huber_delta: 0.2
  grad_clip: 5.0
  amp: true
  device: "cuda"
  save_every: 1
  # DDP 专用（一般保持 false；仅当某阶段报 unused parameter 再改为 true）
  ddp_find_unused_parameters: false

loss:
  bits_weight: 1.0
  mse_weight: 1.0
  aux_weight: 0.3
  # 失真第二项：log_mse | psnr | vmaf（bits+mse 联合：single + log_mse）
  mse_term: "log_mse"
  huber_delta_psnr: null
  huber_delta_psnr_scale: 5.0
  # huber_delta_vmaf: null
  # huber_delta_vmaf_scale: 2.0

# 训练脚本可用 CLI/环境变量覆盖 model.mode、model.double_target、loss.mse_term，便于循环扫参：
#   python -m qp_predictor.train --config my_config.yaml --phase 1 --model-mode single --mse-term psnr
#   python -m qp_predictor.train --config my_config.yaml --phase 2 --model-mode double --double-target bits
#   python -m qp_predictor.train --config my_config.yaml --phase 1 --model-mode double --double-target distortion --mse-term log_mse
# 环境变量（CLI 未写时）：QP_TRAIN_MODEL_MODE, QP_TRAIN_DOUBLE_TARGET, QP_TRAIN_MSE_TERM
model:
  # single：一头输出 2 维 (bits + 失真)；double：两头各训一个同结构单输出网络，目录见 data 说明
  mode: "single"
  # 仅 mode=double 时生效：bits | distortion
  double_target: "bits"
  phase2_variant: "flat"
  self_hidden: 128
  edge_hidden: 128
  state_hidden: 64
  head_hidden: 128
  dropout: 0.1
  state_dim: 32

eval:
  max_psnr_value: 255.0
